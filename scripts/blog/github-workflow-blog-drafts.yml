name: Blog drafts → Storyblok

# When a new article lands in content/blog on main, create it as a draft in Storyblok.
# Add these in GitHub → Settings → Secrets and variables → Actions:
#   secret   STORYBLOK_MANAGEMENT_TOKEN   (personal access token)
#   variable STORYBLOK_SPACE_ID
#   variable STORYBLOK_REGION             (optional, defaults to eu)

on:
  push:
    branches: [main]
    paths: ['content/blog/*.md']
  workflow_dispatch:

jobs:
  push-drafts:
    runs-on: ubuntu-latest
    env:
      STORYBLOK_MANAGEMENT_TOKEN: ${{ secrets.STORYBLOK_MANAGEMENT_TOKEN }}
      STORYBLOK_SPACE_ID: ${{ vars.STORYBLOK_SPACE_ID }}
      STORYBLOK_REGION: ${{ vars.STORYBLOK_REGION || 'eu' }}
    steps:
      - name: Check configuration
        if: ${{ env.STORYBLOK_MANAGEMENT_TOKEN == '' || env.STORYBLOK_SPACE_ID == '' }}
        run: echo "::notice::Add STORYBLOK_MANAGEMENT_TOKEN (secret) and STORYBLOK_SPACE_ID (variable) to push drafts automatically."

      - uses: actions/checkout@v4
        if: ${{ env.STORYBLOK_MANAGEMENT_TOKEN != '' && env.STORYBLOK_SPACE_ID != '' }}

      - uses: actions/setup-node@v4
        if: ${{ env.STORYBLOK_MANAGEMENT_TOKEN != '' && env.STORYBLOK_SPACE_ID != '' }}
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: ${{ env.STORYBLOK_MANAGEMENT_TOKEN != '' && env.STORYBLOK_SPACE_ID != '' }}
        run: npm ci

      - name: Create Storyblok drafts
        if: ${{ env.STORYBLOK_MANAGEMENT_TOKEN != '' && env.STORYBLOK_SPACE_ID != '' }}
        run: npm run blog:push
